
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>まちカルBASE 学生自習室</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #f3f8fa;
      font-family: sans-serif;
      text-align: center;
    }
    .card {
      max-width: 420px;
      margin: 40px auto;
      padding: 30px 20px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 16px #00000010;
    }
    h1 { color: #147d9c; }
    #status {
      background: #eaf3f6;
      border-radius: 10px;
      padding: 16px;
      line-height: 1.8;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>まちカルBASE</h1>
    <h2>学生自習室 受付</h2>

    <p id="status">LINE認証を確認しています...</p>

<div id="student-registration" style="margin-top: 24px;">
  <h3>初めて利用する方</h3>
  <p>学生IDを入力してください</p>

  <input
    type="text"
    id="studentId"
    placeholder="例：ST001"
    autocomplete="off"
    style="padding: 12px; width: 80%; font-size: 16px;"
  >

  
<button
  type="button"
  id="checkStudentIdButton"
  onclick="checkStudentId()"
  style="display: block; margin: 16px auto; padding: 12px 24px;"
>
  学生IDを確認する
</button>

<p id="studentIdMessage" style="font-size: 14px;"></p>
  
<div id="new-student-registration" style="margin-top: 30px;">
  <h3>学生の新規登録</h3>

  <p>氏名</p>
  <input
    type="text"
    id="newStudentName"
    placeholder="例：長町 太郎"
    autocomplete="name"
    style="padding: 12px; width: 80%; font-size: 16px;"
  >

  <p>学校名</p>
  <input
    type="text"
    id="newStudentSchool"
    placeholder="例：〇〇高等学校"
    style="padding: 12px; width: 80%; font-size: 16px;"
  >

  <p>学年</p>
  <select
    id="newStudentGrade"
    style="padding: 12px; width: 88%; font-size: 16px;"
  >
    <option value="">学年を選択してください</option>
    <option>中学1年</option>
    <option>中学2年</option>
    <option>中学3年</option>
    <option>高校1年</option>
    <option>高校2年</option>
    <option>高校3年</option>
    <option>専門・短大1年</option>
    <option>専門・短大2年</option>
    <option>専門・短大3年</option>
    <option>専門・短大4年</option>
    <option>大学1年</option>
    <option>大学2年</option>
    <option>大学3年</option>
    <option>大学4年</option>
    <option>大学5年</option>
    <option>大学6年</option>
    <option>その他</option>
  </select>


<button
  type="button"
  onclick="checkNewStudentRegistration()"
  style="display: block; margin: 20px auto; padding: 12px 24px;"
>
  入力内容を確認する
</button>

<p id="newStudentMessage" style="font-size: 14px;"></p>

<div
  id="newStudentConfirmation"
  style="display: none; padding: 15px; margin-top: 15px; border: 1px solid #ccc; border-radius: 8px;"
>
  <h3>登録内容の確認</h3>
  <p id="confirmStudentName"></p>
  <p id="confirmStudentSchool"></p>
  <p id="confirmStudentGrade"></p>
</div>


  <p style="font-size: 13px; color: #666;">
    ※現在は準備中です。登録情報は送信されません。
  </p>
</div>



  <p style="font-size: 13px; color: #666;">
    ※申請後、管理者の承認が必要です。
  </p>
</div>

    <p>現在は動作確認中です。<br>
    チケットは消化されません。</p>
  </main>

  <script>
    const LIFF_ID = "2012068721-KJW8iAu1";

    async function main() {
      const status = document.getElementById("status");

      try {
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          if (liff.isInClient()) {
            throw new Error("LINE内のログイン状態を確認できません");
          }

          status.textContent = "LINEログインへ移動します...";
          liff.login();
          return;
        }

        if (!liff.getIDToken()) {
  throw new Error("IDトークンを取得できません");
}

        status.textContent =
          "LINEログインを確認しました。\n" +
          "受付機能は現在準備中です。";

      } catch (error) {
        status.textContent =
          "認証エラー：" + error.message;
      }
    }

    main();
  </script>
 
<script>
  function checkStudentId() {
    const input = document.getElementById("studentId");
    const message = document.getElementById("studentIdMessage");

    const studentId = input.value.trim().toUpperCase();
    input.value = studentId;

    if (!studentId) {
      message.textContent = "学生IDを入力してください。";
      return;
    }

    if (!/^ST[0-9]+$/.test(studentId)) {
      message.textContent = "学生IDは ST001 のように入力してください。";
      return;
    }

    message.textContent =
      "入力形式を確認しました。LINE連携申請はまだ送信されません。";
  }
</script>
 
<script>
  function checkNewStudentRegistration() {
    
    if (!liff.isLoggedIn() || !liff.getIDToken()) {
      document.getElementById("newStudentMessage").textContent =
        "LINEログインを確認できません。";
      return;
    }

    const name = document
      .getElementById("newStudentName").value.trim();

    const school = document
      .getElementById("newStudentSchool").value.trim();

    const grade = document
      .getElementById("newStudentGrade").value;

    const message = document
      .getElementById("newStudentMessage");

    if (!name) {
      message.textContent = "氏名を入力してください。";
      return;
    }

    if (!school) {
      message.textContent = "学校名を入力してください。";
      return;
    }

    if (!grade) {
      message.textContent = "学年を選択してください。";
      return;
    }

    message.textContent =
      "入力内容を確認しました。現在は準備中のため、登録情報は送信されません。";
  }
</script>

</body>
</html>
