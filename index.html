
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>まちカルBASE 学生自習室</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #f3f8fa;
      font-family: sans-serif;
      text-align: center;
    }
    .card {
      max-width: 420px;
      margin: 40px auto;
      padding: 30px 20px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 16px #00000010;
    }
    h1 { color: #147d9c; }
    #status {
      background: #eaf3f6;
      border-radius: 10px;
      padding: 16px;
      line-height: 1.8;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>まちカルBASE</h1>
    <h2>学生自習室 受付</h2>

    <p id="status">LINE認証を確認しています...</p>

<div id="student-registration" style="margin-top: 24px;">
  <h3>初めて利用する方</h3>
  <p>学生IDを入力してください</p>

  <input
    type="text"
    id="studentId"
    placeholder="例：ST001"
    autocomplete="off"
    style="padding: 12px; width: 80%; font-size: 16px;"
  >

  
<button
  type="button"
  id="checkStudentIdButton"
  onclick="checkStudentId()"
  style="display: block; margin: 16px auto; padding: 12px 24px;"
>
  学生IDを確認する
</button>

<p id="studentIdMessage" style="font-size: 14px;"></p>


  <p style="font-size: 13px; color: #666;">
    ※申請後、管理者の承認が必要です。
  </p>
</div>

    <p>現在は動作確認中です。<br>
    チケットは消化されません。</p>
  </main>

  <script>
    const LIFF_ID = "2012068721-KJW8iAu1";

    async function main() {
      const status = document.getElementById("status");

      try {
        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          if (liff.isInClient()) {
            throw new Error("LINE内のログイン状態を確認できません");
          }

          status.textContent = "LINEログインへ移動します...";
          liff.login();
          return;
        }

        if (!liff.getIDToken()) {
          throw new Error("IDトークンを取得できません");
      　 }

        status.textContent =
          "LINEログインを確認しました。\n" +
          "受付機能は現在準備中です。";

      } catch (error) {
        status.textContent =
          "認証エラー：" + error.message;
      }
    }

    main();
  </script>
 
<script>
  function checkStudentId() {
    const input = document.getElementById("studentId");
    const message = document.getElementById("studentIdMessage");

    const studentId = input.value.trim().toUpperCase();
    input.value = studentId;

    if (!studentId) {
      message.textContent = "学生IDを入力してください。";
      return;
    }

    if (!/^ST[0-9]+$/.test(studentId)) {
      message.textContent = "学生IDは ST001 のように入力してください。";
      return;
    }

    message.textContent =
      "入力形式を確認しました。LINE連携申請はまだ送信されません。";
  }
</script>
 
</body>
</html>
